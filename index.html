<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weihnachtswünsche</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Schritt 1: Wer bist du? -->
    <section id="schritt-ich">
      <h1 tabindex="-1">Weihnachtswünsche</h1>
      <p class="intro">Wer bist du? Such deinen Namen aus.</p>
      <ul id="kacheln-ich" class="kacheln"></ul>
    </section>

    <!-- Schritt 2: Wessen Wunsch? (eigene Kachel wird ausgeblendet) -->
    <section id="schritt-wahl" hidden>
      <h1 id="wahl-titel" tabindex="-1"></h1>
      <p class="intro">Wähle den Namen, für den du den Wunsch sehen möchtest.</p>
      <ul id="kacheln-wahl" class="kacheln"></ul>
      <p class="mitte"><button type="button" id="nicht-ich" class="knopf knopf-leise">Zurück</button></p>
    </section>

    <!-- Schritt 3: Wunsch -->
    <section id="schritt-wunsch" hidden>
      <article class="karte">
        <div class="detail-icon" id="detail-icon" aria-hidden="true"></div>
        <p class="detail-name" id="detail-name"></p>
        <h2 id="detail-titel" tabindex="-1"></h2>
        <p id="detail-text"></p>
        <a id="detail-link" class="knopf" target="_blank" rel="noopener noreferrer"></a>
        <button type="button" id="zurueck" class="knopf knopf-leise">Zurück</button>
      </article>
    </section>
  </main>

  <script src="wuensche.js"></script>
  <script src="script.js"></script>
</body>
</html>
